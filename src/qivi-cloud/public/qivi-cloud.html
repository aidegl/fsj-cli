<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qivi 云端小人 V1.0.1（原版形象）</title>
<style>
  body { margin: 0; background: #0a0a12; color: #e8e8f0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #stage { margin-top: 8vh; min-height: 260px; min-width: 280px; display: flex; align-items: center; justify-content: center; }
  #status { margin: 12px; font-size: 14px; color: #9aa; min-height: 20px; }
  #controls { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
  button { background: #2a2a3a; color: #e8e8f0; border: 1px solid #444; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button.rec { background: #a33; border-color: #c44; }
  button.active { background: #2a6; border-color: #3c8; }
  #log { font-size: 12px; color: #667; max-width: 640px; text-align: left; white-space: pre-wrap; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="status">初始化…</div>
  <div id="controls">
    <button id="micBtn">🎤 开启麦克风</button>
    <button id="modeBtn" disabled>模式：手动（按住说话）</button>
    <button id="talkBtn" disabled>按住说话</button>
  </div>
  <div id="log"></div>
<script src="/qivi-dock.iife.js"></script>
<script>
'use strict';
// ============ 配置 ============
const WAKE_WORD = 'qivi';
const WAKE_VARIANTS = ['qivi', 'kiwi', 'kivi', 'q i v i', '奇一'];
const API = '/qivi';               // nginx location /qivi/ 前缀（同源）
const statusEl = document.getElementById('status'), logEl = document.getElementById('log');
const micBtn = document.getElementById('micBtn'), modeBtn = document.getElementById('modeBtn'), talkBtn = document.getElementById('talkBtn');
const log = (s) => { logEl.textContent = s + '\n' + logEl.textContent; };

// ============ 原版形象（QiviDock）驱动 ============
const Q = window.QiviDock;
const setEmotion = (e) => { try { Q && Q.setEmotion && Q.setEmotion(e); } catch (err) { log('setEmotion: ' + err.message); } };

// ============ 状态 ============
let mode = 'manual';             // manual | listen
let convState = 'listening';     // 与服务端镜像
let micStream = null, pcmCtx = null, pcmProc = null;
let recording = false, pcmChunks = [], liveAnalyser = null, liveBuf = null;
const VAD_THRESHOLD = 0.04;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// ============ 开麦：PCM 16k 采集（直发后端 pcm_b64——后端零改动） ============
async function openMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  pcmCtx = new AudioContext({ sampleRate: 16000 });
  const src = pcmCtx.createMediaStreamSource(micStream);
  pcmProc = pcmCtx.createScriptProcessor(4096, 1, 1);
  src.connect(pcmProc);
  const mute = pcmCtx.createGain(); mute.gain.value = 0;   // 防啸叫：处理后静音落喇叭
  pcmProc.connect(mute); mute.connect(pcmCtx.destination);
  liveAnalyser = pcmCtx.createAnalyser(); liveAnalyser.fftSize = 512;
  src.connect(liveAnalyser);
  liveBuf = new Uint8Array(liveAnalyser.fftSize);
  pcmProc.onaudioprocess = (e) => {
    if (!recording) return;
    const f = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) { const v = Math.max(-1, Math.min(1, f[i])); i16[i] = v < 0 ? v * 32768 : v * 32767; }
    pcmChunks.push(i16);
  };
  micBtn.disabled = true; micBtn.textContent = '🎤 已开启';
  talkBtn.disabled = false;
  statusEl.textContent = '麦克风就绪（PCM 16k · 模式：' + (mode === 'manual' ? '手动' : '监听·唤醒词「' + WAKE_WORD + '」') + '）';
}

// ============ VAD 循环（监听态：振幅超阈值自动录音） ============
(function vadLoop() {
  if (liveAnalyser && mode === 'listen' && !recording) {
    liveBuf && liveAnalyser.getByteTimeDomainData(liveBuf);
    let peak = 0; for (const v of (liveBuf || [])) peak = Math.max(peak, Math.abs(v - 128) / 128);
    if (peak > VAD_THRESHOLD) startRec();
  }
  setTimeout(vadLoop, 300);
})();

// ============ 停止采集 → PCM 拼接 → 上传 ============
function stopPcm() {
  recording = false;
  const total = pcmChunks.reduce((s, c) => s + c.length, 0);
  const pcm = new Int16Array(total);
  let off = 0; for (const c of pcmChunks) { pcm.set(c, off); off += c.length; }
  pcmChunks = [];
  return pcm;
}

async function sendVoice(pcm) {
  statusEl.textContent = '识别中…';
  setEmotion('thinking');
  try {
    const r = await fetch(API + '/voice', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: 'mac-agent', pcm_b64: b64FromI16(pcm) }) });
    const j = await r.json();
    if (j.error) { log('错误: ' + j.error); statusEl.textContent = '出错'; setEmotion('default'); return; }
    convState = j.state;
    if (!j.matched && j.asr) { statusEl.textContent = '监听中（未含唤醒词）'; log('ASR: ' + j.asr + '（未命中，忽略）'); setEmotion('default'); return; }
    statusEl.textContent = 'qivi：' + (j.reply_text || '').slice(0, 60);
    log('qivi：' + j.reply_text);
    if (j.reply_audio_b64) { await playReply(j.reply_audio_b64); }
    else { setEmotion('default'); log('（TTS 未出音频：' + (j.tts_error || '无') + '）'); }
  } catch (e) { log('链路错误: ' + e.message); statusEl.textContent = '链路错误'; setEmotion('default'); }
}
function b64FromI16(i16) {
  const bytes = new Uint8Array(i16.buffer, i16.byteOffset, i16.byteLength);
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
}

// ============ 播放 TTS 回执 + 情绪联动 ============
async function playReply(b64) {
  const el = new Audio('data:audio/mp3;base64,' + b64);
  try { Q && Q.reaction && Q.reaction('speak'); } catch (e) {}
  setEmotion('happy');
  bindPlayAnalyser(el);
  await el.play().catch(() => { statusEl.textContent = '点一次页面任意处后重试播放'; });
  el.onended = () => setEmotion('default');
}
let playCtx = null, playAn = null, playBuf = null;
function bindPlayAnalyser(el) {
  playCtx = playCtx || new AudioContext();
  const src = playCtx.createMediaElementSource(el);
  playAn = playCtx.createAnalyser(); playAn.fftSize = 256;
  src.connect(playAn); playAn.connect(playCtx.destination);
  playBuf = new Uint8Array(playAn.frequencyBinCount);
  (function loop() {
    if (playAn) { playAn.getByteFrequencyData(playBuf); let s = 0; for (const v of playBuf) s += v * v; amp = Math.min(1, Math.sqrt(s / playBuf.length) / 96); mouth = Math.min(1, amp * 2.2); }
    requestAnimationFrame(loop);
  })();
}
let amp = 0, mouth = 0;

// ============ 录音流程（手动/监听共用） ============
async function startRec() {
  if (recording || !pcmProc) return;
  recording = true; pcmChunks = [];
  statusEl.textContent = '聆听中…';
  const liveCopy = liveAnalyser, liveB = liveBuf;
  let silent = 0;
  const check = () => {
    if (!recording) return;
    if (liveCopy) { liveCopy.getByteTimeDomainData(liveB); let peak = 0; for (const v of liveB) peak = Math.max(peak, Math.abs(v - 128) / 128); if (peak < VAD_THRESHOLD / 2) { if (++silent > 36) { const pcm = stopPcm(); if (pcm.length > 3200) sendVoice(pcm); else { statusEl.textContent = '（太短）'; recording = false; } return; } } else silent = 0; }
    setTimeout(check, 100);
  };
  setTimeout(check, 400);
}

// ============ 控件 ============
micBtn.onclick = () => openMic().catch(e => statusEl.textContent = '麦克风失败: ' + e.message);
modeBtn.onclick = () => {
  mode = (mode === 'manual') ? 'listen' : 'manual';
  modeBtn.textContent = '模式：' + (mode === 'manual' ? '手动（按住说话）' : '监听（唤醒词「' + WAKE_WORD + '」）');
  modeBtn.classList.toggle('active', mode === 'listen');
  statusEl.textContent = '模式已切换：' + mode;
};
talkBtn.onmousedown = talkBtn.ontouchstart = () => { if (!recording) startRec(); };
talkBtn.onmouseup = talkBtn.ontouchend = () => { if (recording) { const pcm = stopPcm(); if (pcm.length > 3200) sendVoice(pcm); } };

// 初始化
fetch(API + '/config').then(r => r.json()).then(j => {
  statusEl.textContent = '就绪（唤醒词「' + j.wake_word + '」· TTS ' + (j.tts_ready ? '已配置' : '未配置——仅文本模式') + '）';
}).catch(() => { statusEl.textContent = '服务未连接'; });
</script>
</body>
</html>
