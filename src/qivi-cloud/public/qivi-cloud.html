<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qivi 云端小人 V1.0</title>
<style>
  body { margin: 0; background: #0a0a12; color: #e8e8f0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #stage { margin-top: 6vh; }
  #status { margin: 12px; font-size: 14px; color: #9aa; min-height: 20px; }
  #controls { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
  button { background: #2a2a3a; color: #e8e8f0; border: 1px solid #444; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button.rec { background: #a33; border-color: #c44; }
  button.active { background: #2a6; border-color: #3c8; }
  #log { font-size: 12px; color: #667; max-width: 600px; text-align: left; white-space: pre-wrap; }
</style>
</head>
<body>
  <canvas id="stage" width="480" height="360"></canvas>
  <div id="status">初始化…</div>
  <div id="controls">
    <button id="micBtn">🎤 开启麦克风</button>
    <button id="modeBtn" disabled>模式：手动（按住说话）</button>
    <button id="talkBtn" disabled>按住说话</button>
  </div>
  <div id="log"></div>
<script>
'use strict';
// ============ 配置 ============
const WAKE_WORD = 'qivi';
const SILENCE_TIMEOUT_MS = 30000;
const VAD_THRESHOLD = 0.04;      // 振幅阈值（监听态：超阈值=有人说话）
const API = '';                   // 同源（经 nginx 反代）

// ============ 粒子小人（canvas 2D 精简版：振幅驱动+口型） ============
const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
const N = 260;
const parts = [];
for (let i = 0; i < N; i++) {
  // 粒子初始分布：人形轮廓（头圆+身柱）
  const head = i < 60, t = Math.random() * Math.PI * 2;
  parts.push(head
    ? { bx: 240 + Math.cos(t) * (30 + Math.random() * 12), by: 110 + Math.sin(t) * (30 + Math.random() * 12), phase: Math.random() * Math.PI * 2 }
    : { bx: 240 + Math.cos(t) * (16 + Math.random() * 20), by: 170 + Math.random() * 110, phase: Math.random() * Math.PI * 2 });
}
let amp = 0, mouth = 0;   // 振幅（驱动位移）与口型开合
function render() {
  ctx.clearRect(0, 0, 480, 360);
  ctx.fillStyle = '#7ecbff';
  for (const p of parts) {
    const dx = Math.sin(p.phase + Date.now() / 300) * amp * 260;   // 振幅→位移
    const dy = Math.cos(p.phase * 1.3 + Date.now() / 240) * amp * 200;
    const size = 2 + amp * 14 + (mouth && p.by > 100 && p.by < 150 ? mouth * 6 : 0);
    ctx.globalAlpha = 0.5 + amp * 3;
    ctx.fillRect(p.bx + dx, p.by + dy, size, size);
  }
  ctx.globalAlpha = 1;
  // 口型条（嘴部高度可视化振幅）
  ctx.fillStyle = '#ffd07e';
  ctx.fillRect(210, 168, 60, mouth * 60 + 2);
  requestAnimationFrame(render);
}
render();

// ============ 音频分析（播放侧：AnalyserNode → amp/mouth） ============
let analyser = null, playCtx = null;
function bindAnalyser(audioEl) {
  playCtx = playCtx || new AudioContext();
  const src = playCtx.createMediaElementSource(audioEl);
  analyser = playCtx.createAnalyser();
  analyser.fftSize = 256;
  src.connect(analyser); analyser.connect(playCtx.destination);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  (function loop() {
    if (analyser) {
      analyser.getByteFrequencyData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      amp = Math.min(1, Math.sqrt(sum / buf.length) / 96);       // 振幅归一
      mouth = Math.min(1, amp * 2.2);                             // 口型开合
    }
    requestAnimationFrame(loop);
  })();
}

// ============ 麦克风 + VAD + 录音 ============
const statusEl = document.getElementById('status'), logEl = document.getElementById('log');
const log = (s) => { logEl.textContent = s + '\n' + logEl.textContent; };
let micStream = null, audioCtxMic = null, mediaRecorder = null, chunks = [];
let mode = 'manual';             // manual | listen
let listening = false;           // 监听态下的 VAD 循环开关
let convState = 'listening';     // listening | conversation（与服务端状态镜像）
let silenceTimer = null;
const micBtn = document.getElementById('micBtn'), modeBtn = document.getElementById('modeBtn'), talkBtn = document.getElementById('talkBtn');

async function openMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtxMic = new AudioContext();
  const src = audioCtxMic.createMediaStreamSource(micStream);
  const an = audioCtxMic.createAnalyser(); an.fftSize = 512;
  src.connect(an);
  const buf = new Uint8Array(an.fftSize);
  micBtn.disabled = true; micBtn.textContent = '🎤 已开启';
  talkBtn.disabled = false;
  statusEl.textContent = '麦克风就绪（模式：' + (mode === 'manual' ? '手动' : '监听·唤醒词「' + WAKE_WORD + '」') + '）';
  // VAD 循环（监听态：超阈值=开始录音；手动态：不自动录）
  (function vad() {
    if (micStream.active && mode === 'listen' && !listening) {
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128) / 128);
      if (peak > VAD_THRESHOLD) startRec();
    }
    requestAnimationFrame(vad);
  })();
}

function startRec() {
  if (listening || !micStream || !window.MediaRecorder) return;
  listening = true;
  chunks = [];
  mediaRecorder = new MediaRecorder(micStream, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '' });
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = async () => {
    listening = false;
    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    if (blob.size < 2000) return;                      // 过短丢弃
    statusEl.textContent = '识别中…';
    try {
      const b64 = await blobToB64(blob);
      const r = await fetch(API + '/voice', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agent: 'mac-agent', audio_b64: b64, audio_format: 'webm' }) });
      const j = await r.json();
      if (j.error) { log('错误: ' + j.error); statusEl.textContent = '出错'; return; }
      convState = j.state;
      if (!j.matched && j.asr) {
        statusEl.textContent = '监听中（未含唤醒词「' + WAKE_WORD + '」）';
        return;                                        // 未命中唤醒词：丢弃，不播
      }
      statusEl.textContent = 'qivi：' + (j.reply_text || '(TTS 未配置，仅文本)');
      if (j.reply_audio_b64) playAudio(j.reply_audio_b64);
    } catch (e) { log('链路错误: ' + e.message); statusEl.textContent = '链路错误'; }
  };
  mediaRecorder.start();
  statusEl.textContent = '聆听中…';
  // 静音检测：1.2s 振幅低于阈值 → 停止录音送识别
  const an = audioCtxMic.createAnalyser(); audioCtxMic.createMediaStreamSource(micStream).connect(an);
  const buf = new Uint8Array(an.fftSize);
  let silentFrames = 0;
  const check = () => {
    if (!listening) return;
    an.getByteTimeDomainData(buf);
    let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128) / 128);
    if (peak < VAD_THRESHOLD / 2) { if (++silentFrames > 36) { mediaRecorder.stop(); return; } }
    else silentFrames = 0;
    requestAnimationFrame(check);
  };
  setTimeout(check, 400);
}

function blobToB64(blob) {
  return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(blob); });
}
function playAudio(b64) {
  const el = new Audio('data:audio/mp3;base64,' + b64);
  bindAnalyser(el);                                    // 播放接 Analyser → 粒子/口型
  el.play().catch(() => { statusEl.textContent = '点一次页面任意处后重试播放（自动播放策略）'; });
}

// ============ 控件 ============
micBtn.onclick = () => openMic().catch(e => statusEl.textContent = '麦克风失败: ' + e.message);
modeBtn.onclick = () => {
  mode = (mode === 'manual') ? 'listen' : 'manual';
  modeBtn.textContent = '模式：' + (mode === 'manual' ? '手动（按住说话）' : '监听（唤醒词「' + WAKE_WORD + '」）');
  modeBtn.classList.toggle('active', mode === 'listen');
  statusEl.textContent = '模式已切换：' + mode;
};
talkBtn.onmousedown = talkBtn.ontouchstart = startRec;

// 初始化拉配置
fetch(API + '/config').then(r => r.json()).then(j => {
  statusEl.textContent = '就绪（唤醒词「' + j.wake_word + '」· TTS ' + (j.tts_ready ? '已配置' : '未配置——仅文本模式') + '）';
}).catch(() => { statusEl.textContent = '服务未连接'; });
</script>
</body>
</html>
